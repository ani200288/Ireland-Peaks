<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Peak Map | PeakLog Ireland</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">

  <!-- Leaflet Map CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>
    #irelandMap {
      height: clamp(420px, 70vh, 620px);
      width: 100%;
      border-radius: 0.9rem;
      z-index: 1;
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-alpine sticky-top shadow-sm">
    <div class="container py-1">
      <a class="navbar-brand fw-bold fs-4" href="index.html">
        PeakLog Ireland
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0 gap-1">
          <li class="nav-item">
            <a class="nav-link fw-semibold px-3 rounded" href="index.html">
              ⛰️ Home &amp; Peaks
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold px-3 rounded" href="achievements.html">
              🏆 Achievements
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active fw-semibold px-3 rounded"
              aria-current="page"
              href="map.html"
            >
              🗺️ Peak Map
            </a>
          </li>
        </ul>

        <span
          id="climbedCounter"
          class="badge bg-warning text-dark fs-6 px-3 py-2 rounded-pill"
          aria-live="polite"
        >
          0 / 409 Arderins Climbed
        </span>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="py-4">
    <div class="container">
      <!-- Map controls -->
      <div class="bg-white p-3 p-md-4 rounded-3 shadow-sm mb-3">
        <div class="row align-items-center g-3">
          <div class="col-12 col-lg-5">
            <h1 class="h4 fw-bold mb-1">
              409 Arderins Interactive Map
            </h1>

            <div class="small text-muted d-flex flex-wrap gap-3">
              <span>
                <span
                  class="legend-dot"
                  style="background:#10B981;"
                  aria-hidden="true"
                ></span>
                Climbed Summit
              </span>

              <span>
                <span
                  class="legend-dot"
                  style="background:#64748B;"
                  aria-hidden="true"
                ></span>
                Unclimbed Summit
              </span>
            </div>
          </div>

          <div class="col-6 col-md-4 col-lg-4">
            <label for="mapRangeFilter" class="visually-hidden">
              Filter peaks by mountain range
            </label>
            <select
              id="mapRangeFilter"
              class="form-select form-select-sm"
            >
              <option value="all">All Mountain Ranges</option>
            </select>
          </div>

          <div class="col-6 col-md-4 col-lg-3">
            <label for="mapStatusFilter" class="visually-hidden">
              Filter peaks by climbed status
            </label>
            <select
              id="mapStatusFilter"
              class="form-select form-select-sm"
            >
              <option value="all">Show All (409)</option>
              <option value="climbed">Climbed Only</option>
              <option value="unclimbed">Unclimbed Only</option>
            </select>
          </div>
        </div>

        <p
          id="mapStatus"
          class="small text-muted mb-0 mt-2"
          aria-live="polite"
        ></p>
      </div>

      <!-- Map -->
      <div class="bg-white p-2 rounded-3 shadow-sm">
        <div
          id="irelandMap"
          role="region"
          aria-label="Interactive map of Irish peaks"
        >
          Loading map…
        </div>
      </div>

      <noscript>
        <div class="alert alert-warning mt-3">
          JavaScript is required to display the interactive peak map.
        </div>
      </noscript>
    </div>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>

  <!-- Leaflet Map JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="anonymous"
  ></script>

  <script src="js/peaks-app.js"></script>
</body>
</html>
```
